        tailwind.config = {

    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #faf6ef;
            color: #0b1120;
            overflow-x: hidden;
        }

        /* ── Custom Scrollbar ── */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4a853;
            border-radius: 20px;
        }

        /* ── Glassmorphism ── */
        .glass {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.30);
        }
        .glass-dark {
            background: rgba(11, 17, 32, 0.75);
            backdrop-filter: blur(24px) saturate(1.6);
            -webkit-backdrop-filter: blur(24px) saturate(1.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* ── Gold Gradient Text ── */
        .text-gold-gradient {
            background: linear-gradient(135deg, #d4a853 0%, #f0d68a 40%, #d4a853 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ── Button Premium ── */
        .btn-premium {
            background: linear-gradient(135deg, #d4a853 0%, #e8c97a 50%, #d4a853 100%);
            background-size: 200% 200%;
            animation: shimmer 3s ease-in-out infinite;
            color: #0b1120;
            font-weight: 600;
            border: none;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 4px 20px rgba(212, 168, 83, 0.30);
        }
        .btn-premium:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 32px rgba(212, 168, 83, 0.45);
        }
        .btn-premium:active {
            transform: scale(0.97);
        }
        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* ── Card Hover ── */
        .restaurant-card {
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        .restaurant-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 24px 64px rgba(11, 17, 32, 0.12);
        }

        /* ── Rating Stars ── */
        .star-filled {
            color: #d4a853;
        }
        .star-empty {
            color: #d1d5db;
        }

        /* ── Featured Badge ── */
        .badge-featured {
            background: linear-gradient(135deg, #d4a853, #f0d68a);
            color: #0b1120;
            font-weight: 700;
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            box-shadow: 0 2px 12px rgba(212, 168, 83, 0.35);
            text-transform: uppercase;
        }

        /* ── Ad Card ── */
        .ad-card {
            background: linear-gradient(145deg, #1a2a4a, #0b1120);
            border: 1px solid rgba(212, 168, 83, 0.15);
            position: relative;
            overflow: hidden;
        }
        .ad-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 20%, rgba(212, 168, 83, 0.06), transparent 70%);
            pointer-events: none;
        }
        .ad-tag {
            background: rgba(212, 168, 83, 0.15);
            color: #d4a853;
            font-size: 0.55rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            padding: 0.15rem 0.6rem;
            border-radius: 40px;
            border: 1px solid rgba(212, 168, 83, 0.15);
        }

        /* ── Modal Overlay ── */
        .modal-overlay {
            background: rgba(11, 17, 32, 0.70);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-slide {
            animation: slideUp 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Skeleton ── */
        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: shimmer-skeleton 1.5s infinite;
            border-radius: 0.75rem;
        }
        @keyframes shimmer-skeleton {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* ── Search Bar Premium ── */
        .search-premium {
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.50);
            box-shadow: 0 4px 24px rgba(11, 17, 32, 0.06);
            transition: all 0.3s ease;
        }
        .search-premium:focus-within {
            box-shadow: 0 8px 40px rgba(212, 168, 83, 0.15);
            border-color: #d4a853;
            background: rgba(255, 255, 255, 0.92);
        }

        /* ── Category Pills ── */
        .cat-pill {
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.60);
            border: 1px solid rgba(255, 255, 255, 0.40);
            color: #4b5563;
            transition: all 0.25s ease;
            white-space: nowrap;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .cat-pill.active {
            background: #0b1120;
            color: #fff;
            border-color: #0b1120;
            box-shadow: 0 4px 16px rgba(11, 17, 32, 0.15);
        }
        .cat-pill:active {
            transform: scale(0.95);
        }

        /* ── Toast ── */
        .toast {
            background: #0b1120;
            color: #fff;
            border-radius: 1rem;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(11, 17, 32, 0.25);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ── Responsive tweaks ── */
        @media (max-width: 480px) {
            .restaurant-card {
                transform: none !important;
            }
            .restaurant-card:active {
                transform: scale(0.98) !important;
            }
        }

        /* ── Bottom nav safe area ── */
        .bottom-nav {
            padding-bottom: env(safe-area-inset-bottom, 0.5rem);
        }
    </style>
</head>
<body>

    <!-- ─── APP ─── -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

        // ─── Supabase Client ───

        const MOCK_RESTAURANTS = [{

            featured: true,

            description: 'Royal Newari dining experience in a restored 19th-century mansion.',
            menu: [
                { name: 'Royal Thali', price: 1800, desc: 'Multi-course Nepali feast' },
                { name: 'Mutton Sekuwa', price: 850, desc: 'Grilled spiced mutton' },
            ],

        }, {

            rating: 4.5,

            featured: false,
            sponsored: false,

            menu: [
                { name: 'Steam Momo', price: 250, desc: 'Classic buffalo momo' },
                { name: 'Kothey Momo', price: 300, desc: 'Pan-fried momo' },
                { name: 'C Momo', price: 350, desc: 'Chilli garlic momo' },
            ],
            offers: '10% off on orders above 5 plates',
            location: 'New Road, Kathmandu',
            tags: ['Momo', 'Street Food', 'Budget'],
        }, {
            id: 'r6',
            name: 'Himalayan Java',
            cuisine: 'Café • Bakery',
            rating: 4.4,
            reviews: 178,
            price: '$$',
            image: 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=600&h=400&fit=crop',
            featured: false,
            sponsored: false,
            description: 'Specialty coffee roastery with Himalayan-inspired pastries.',
            menu: [
                { name: 'Pour Over', price: 550, desc: 'Single origin, light roast' },
                { name: 'Apple Crumble', price: 390, desc: 'Warm spiced apple crumble' },
            ],
            offers: 'Free pastry with any coffee before 10am',
            location: 'Jhamsikhel, Lalitpur',
            tags: ['Coffee', 'Bakery', 'Work-friendly'],
        }, ];

        // ─── Context ───
        const AppContext = createContext();

        // ─── Main App ───
        function App() {
            const [user, setUser] = useState(null);
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);
            const [restaurants, setRestaurants] = useState(MOCK_RESTAURANTS);
            const [filtered, setFiltered] = useState(MOCK_RESTAURANTS);
            const [search, setSearch] = useState('');
            const [category, setCategory] = useState('All');
            const [favorites, setFavorites] = useState([]);
            const [reviews, setReviews] = useState([]);
            const [selectedRestaurant, setSelectedRestaurant] = useState(null);
            const [showAuth, setShowAuth] = useState(false);
            const [authMode, setAuthMode] = useState('login');
            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [authName, setAuthName] = useState('');
            const [authLoading, setAuthLoading] = useState(false);
            const [toast, setToast] = useState(null);
            const [view, setView] = useState('home'); // home | detail | dashboard
            const [dashboardTab, setDashboardTab] = useState('favorites');

            // ── Auth ──
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    setUser(session?.user ?? null);
                    setLoading(false);
                });

                const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    setUser(session?.user ?? null);
                    setLoading(false);
                });

                return () => listener?.subscription?.unsubscribe();
            }, []);

            // ── Load favorites & reviews ──
            useEffect(() => {
                if (user) {
                    loadFavorites();
                    loadReviews();
                } else {
                    setFavorites([]);
                    setReviews([]);
                }
            }, [user]);

            async function loadFavorites() {
                try {
                    const { data, error } = await supabase
                        .from('favorites')
                        .select('restaurant_id')
                        .eq('user_id', user.id);
                    if (error) throw error;
                    setFavorites(data.map(f => f.restaurant_id));
                } catch (e) {
                    console.warn('Favorites fallback', e);
                    setFavorites(['r1', 'r3']);
                }
            }

            async function loadReviews() {
                try {
                    const { data, error } = await supabase
                        .from('reviews')
                        .select('*')
                        .eq('user_id', user.id);
                    if (error) throw error;
                    setReviews(data || []);
                } catch (e) {
                    console.warn('Reviews fallback', e);
                    setReviews([{ id: 'rev1', restaurant_id: 'r1', rating: 5, comment: 'Amazing!', created_at: new Date()
                            .toISOString() }]);
                }
            }

            async function toggleFavorite(restaurantId) {
                if (!user) {
                    setShowAuth(true);
                    return;
                }
                const isFav = favorites.includes(restaurantId);
                try {
                    if (isFav) {
                        await supabase.from('favorites').delete().eq('user_id', user.id).eq('restaurant_id',
                        restaurantId);
                        setFavorites(favorites.filter(id => id !== restaurantId));
                        showToast('Removed from favorites');
                    } else {
                        await supabase.from('favorites').insert({ user_id: user.id, restaurant_id: restaurantId });
                        setFavorites([...favorites, restaurantId]);
                        showToast('Added to favorites ✨');
                    }
                } catch (e) {
                    // Fallback: local toggle
                    if (isFav) {
                        setFavorites(favorites.filter(id => id !== restaurantId));
                    } else {
                        setFavorites([...favorites, restaurantId]);
                    }
                    showToast(isFav ? 'Removed' : 'Added ✨');
                }
            }

            async function submitReview(restaurantId, rating, comment) {
                if (!user) { setShowAuth(true); return false; }
                try {
                    const { data, error } = await supabase.from('reviews').insert({
                        user_id: user.id,
                        restaurant_id: restaurantId,
                        rating,
                        comment,
                        created_at: new Date().toISOString(),
                    });
                    if (error) throw error;
                    const newReview = { id: data?.[0]?.id || 'rev_' + Date.now(), restaurant_id: restaurantId, rating,
                        comment, created_at: new Date().toISOString() };
                    setReviews([...reviews, newReview]);
                    showToast('Review posted! 🌟');
                    return true;
                } catch (e) {
                    // Fallback: local
                    const newReview = { id: 'rev_' + Date.now(), restaurant_id: restaurantId, rating, comment,
                        created_at: new Date().toISOString() };
                    setReviews([...reviews, newReview]);
                    showToast('Review posted! 🌟');
                    return true;
                }
            }

            function getRestaurantReviews(restaurantId) {
                return reviews.filter(r => r.restaurant_id === restaurantId);
            }

            function isFavorite(id) { return favorites.includes(id); }

            // ── Filtering ──
            useEffect(() => {
                let result = restaurants;
                if (category !== 'All') {
                    result = result.filter(r => r.cuisine.includes(category) || r.tags?.includes(category));
                }
                if (search.trim()) {
                    const q = search.trim().toLowerCase();
                    result = result.filter(r =>
                        r.name.toLowerCase().includes(q) ||
                        r.cuisine.toLowerCase().includes(q) ||
                        r.location?.toLowerCase().includes(q)
                    );
                }
                // Featured first
                result = [...result].sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
                setFiltered(result);
            }, [search, category, restaurants]);

            // ── Toast ──
            function showToast(msg) {
                setToast(msg);
                clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => setToast(null), 2800);
            }

            // ── Auth Handlers ──
            async function handleAuthSubmit(e) {
                e.preventDefault();
                setAuthLoading(true);
                try {
                    if (authMode === 'login') {
                        const { data, error } = await supabase.auth.signInWithPassword({
                            email: authEmail,
                            password: authPassword,
                        });
                        if (error) throw error;
                        setShowAuth(false);
                        showToast('Welcome back! 👋');
                    } else {
                        const { data, error } = await supabase.auth.signUp({
                            email: authEmail,
                            password: authPassword,
                            options: { data: { full_name: authName } },
                        });
                        if (error) throw error;
                        setShowAuth(false);
                        showToast('Account created! 🎉');
                    }
                } catch (e) {
                    showToast(e.message || 'Auth error');
                } finally {
                    setAuthLoading(false);
                }
            }

            async function handleLogout() {
                await supabase.auth.signOut();
                setView('home');
                showToast('Signed out');
            }

            // ── Categories ──
            const categories = ['All', 'Newari', 'Thakali', 'Continental', 'Nepali', 'Café', 'Street Food', 'Asian'];

            // ── Featured & Sponsored ──
            const featuredRestaurants = restaurants.filter(r => r.featured);
            const sponsoredRestaurants = restaurants.filter(r => r.sponsored);

            // ── Context value ──
            const ctx = {
                user,
                session,
                loading,
                restaurants,
                filtered,
                search,
                setSearch,
                category,
                setCategory,
                categories,
                favorites,
                isFavorite,
                toggleFavorite,
                reviews,
                submitReview,
                getRestaurantReviews,
                selectedRestaurant,
                setSelectedRestaurant,
                showAuth,
                setShowAuth,
                authMode,
                setAuthMode,
                authEmail,
                setAuthEmail,
                authPassword,
                setAuthPassword,
                authName,
                setAuthName,
                authLoading,
                handleAuthSubmit,
                handleLogout,
                toast,
                showToast,
                view,
                setView,
                dashboardTab,
                setDashboardTab,
                featuredRestaurants,
                sponsoredRestaurants,
                MOCK_RESTAURANTS,
            };

            return ( <
                AppContext.Provider value = { ctx } >
                <
                RouterView / >
                <
                ToastManager / >
                <
                AuthModal / >
                <
                /AppContext.Provider>
            );
        }

                                    disabled = { submitting }
                                    className = "btn-premium w-full py-2.5 rounded-xl text-sm font-semibold disabled:opacity-50" >
                                    { submitting ? 'Posting...' : 'Post Review' } <
                                    /button> <
                                    /form> <
                                    /div>

                                    <
                                    div className = "space-y-3" > {
                                        reviewsList.length === 0 ? ( <
                                            p className = "text-center text-sm text-brand-slate/50 py-6" >
                                            No reviews yet. Be the first! <
                                            /p>
                                        ) : (
                                            reviewsList.map(rev => ( <
                                                div key = { rev.id }
                                                className = "bg-white/60 backdrop-blur-sm rounded-2xl p-4 border border-white/50" >
                                                <
                                                div className = "flex items-center gap-2" >
                                                <
                                                div className = "flex items-center gap-0.5" > {
                                                    [1, 2, 3, 4, 5].map(i => ( <
                                                        i key = { i }
                                                        className = { `fa-solid fa-star text-xs ${i <= rev.rating ? 'text-gold' : 'text-gray-300'}` } >
                                                        < /i>
                                                    ))
                                                } <
                                                /div> <
                                                span className = "text-xs text-brand-slate/50" >
                                                { new Date(rev.created_at).toLocaleDateString() } < /span> <
                                                /div> <
                                                p className = "text-sm text-brand-navy/80 mt-1" > { rev.comment } < /p> <
                                                /div>
                                            ))
                                        )
                                    } <
                                    /div> <
                                    /div>
                                )
                            } <
                            /div>

                            { /* Bottom Nav */ } <
                            BottomNav / >

                            <
                            /div>
                        );
                    }

                    // ─── Dashboard View ───
                    function DashboardView() {
                        const { user, setView, favorites, restaurants, reviews, handleLogout, dashboardTab, setDashboardTab,
                            showToast } =
                            useContext(AppContext);
                        const [activeTab, setActiveTab] = useState(dashboardTab || 'favorites');

                        useEffect(() => {
                            setDashboardTab(activeTab);
                        }, [activeTab]);

                        const favRestaurants = restaurants.filter(r => favorites.includes(r.id));
                        const userReviews = reviews;

                        if (!user) {
                            return ( <
                                div className = "min-h-screen flex items-center justify-center p-6 bg-[#faf6ef]" >
                                <
                                div className = "text-center" >
                                <
                                i className = "fas fa-lock text-3xl text-brand-slate/30 mb-4" > < /i> <
                                p className = "text-brand-navy font-medium" > Please sign in to view your dashboard < /p> <
                                button onClick = {
                                    () => setView('home') }
                                className = "mt-4 btn-premium px-6 py-2 rounded-full text-sm" >
                                Go Home <
                                /button> <
                                /div> <
                                /div>
                            );
                        }

                        return ( <
                                div className = "min-h-screen bg-[#faf6ef] pb-28" >
                                { /* Header */ } <
                                header className = "sticky top-0 z-40 glass border-b border-white/30" >
                                <
                                div className = "px-4 py-3 flex items-center justify-between max-w-lg mx-auto" >
                                <
                                button onClick = {
                                    () => setView('home') }
                                className = "w-9 h-9 rounded-full bg-white/50 flex items-center justify-center text-brand-navy hover:bg-white/80 transition-all" >
                                <
                                i className = "fas fa-arrow-left" > < /i> <
                                /button> <
                                span className = "font-display text-sm font-bold text-brand-navy" > Dashboard < /span> <
                                button onClick = { handleLogout }
                                className = "text-xs font-medium text-brand-slate/60 hover:text-brand-navy transition-colors" >
                                <
                                i className = "fas fa-sign-out-alt mr-1" > < /i> Sign Out <
                                /button> <
                                /div> <
                                /header>

                                { /* User Info */ } <
                                div className = "px-4 pt-4 max-w-lg mx-auto" >
                                <
                                div className = "bg-white/70 backdrop-blur-xl rounded-2xl p-5 border border-white/50 shadow-premium" >
                                <
                                div className = "flex items-center gap-4" >
                                <
                                div className = "w-14 h-14 rounded-2xl bg-gradient-gold flex items-center justify-center shadow-glow" >
                                <
                                i className = "fas fa-user text-2xl text-brand-navy" > < /i> <
                                /div> <
                                div >
                                <
                                h3 className = "font-display text-lg font-bold text-brand-navy" >
                                { user.user_metadata?.full_name || user.email?.split('@')[0] || 'Foodie' } <
                                /h3> <
                                p className = "text-xs text-brand-slate/60" > { user.email } < /p> <
                                /div> <
                                /div> <
                                div className = "flex gap-4 mt-4 pt-4 border-t border-white/40" >
                                <
                                div >
                                <
                                span className = "block text-xl font-bold text-brand-navy" > { favorites.length } < /span> <
                                span className = "text-[0.6rem] text-brand-slate/50 uppercase tracking-wider" >
                                Favorites < /span> <
                                /div> <
                                div >
                                <
                                span className = "block text-xl font-bold text-brand-navy" > { userReviews.length } < /span> <
                                span className = "text-[0.6rem] text-brand-slate/50 uppercase tracking-wider" >
                                Reviews < /span> <
                                /div> <
                                /div> <
                                /div> <
                                /div>

                                { /* Tabs */ } <
                                div className = "px-4 mt-4 max-w-lg mx-auto" >
                                <
                                div className = "flex gap-1 bg-white/60 rounded-2xl p-1 border border-white/40" >
                                <
                                button onClick = {
                                    () => setActiveTab('favorites') }
                                className = { `flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all ${activeTab === 'favorites' ? 'bg-brand-navy text-white shadow-md' : 'text-brand-slate/60 hover:text-brand-navy'}` } >
                                <
                                i className = "fas fa-heart mr-1.5" > < /i> Favorites <
                                /button> <
                                button onClick = {
                                    () => setActiveTab('reviews') }
                                className = { `flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all ${activeTab === 'reviews' ? 'bg-brand-navy text-white shadow-md' : 'text-brand-slate/60 hover:text-brand-navy'}` } >
                                <
                                i className = "fas fa-star mr-1.5" > < /i> My Reviews <
                                /button> <
                                /div> <
                                /div>

                                { /* Content */ } <
                                div className = "px-4 mt-4 pb-8 max-w-lg mx-auto" >
                                {
                                    activeTab === 'favorites' ? ( <
                                        div >
                                        {
                                            favRestaurants.length === 0 ? ( <
                                                div className = "text-center py-12 bg-white/40 rounded-2xl border border-white/40" >
                                                <
                                                i className = "fas fa-heart text-3xl text-brand-slate/20 mb-3" > < /i> <
                                                p className = "text-sm text-brand-slate/60" > No favorites yet < /p> <
                                                button onClick = {
                                                    () => setView('home') }
                                                className = "mt-2 text-gold text-xs font-medium hover:underline" >
                                                Explore restaurants →
                                                <
                                                /button> <
                                                /div>
                                            ) : ( <
                                                div className = "grid grid-cols-2 gap-3" > {
                                                    favRestaurants.map(r => ( <
                                                        RestaurantCard key = { r.id }
                                                        restaurant = { r }
                                                        compact = { true }
                                                        />
                                                    ))
                                                } <
                                                /div>
                                            )
                                        } <
                                        /div>
                                    ) : ( <
                                        div className = "space-y-3" >
                                        {
                                            userReviews.length === 0 ? ( <
                                                div className = "text-center py-12 bg-white/40 rounded-2xl border border-white/40" >
                                                <
                                                i className = "fas fa-pen text-3xl text-brand-slate/20 mb-3" > < /i> <
                                                p className = "text-sm text-brand-slate/60" > You haven't reviewed any restaurants yet < /p> <
                                                button onClick = {
                                                    () => setView('home') }
                                                className = "mt-2 text-gold text-xs font-medium hover:underline" >
                                                Write a review →
                                                <
                                                /button> <
                                                /div>
                                            ) : (
                                                userReviews.map(rev => {
                                                    const r = restaurants.find(rt => rt.id === rev
                                                    .restaurant_id);
                                                    return ( <
                                                        div key = { rev.id }
                                                        className = "bg-white/60 backdrop-blur-sm rounded-2xl p-4 border border-white/50 flex items-start gap-3" >
                                                        <
                                                        div className = "w-14 h-14 rounded-xl overflow-hidden shrink-0 bg-brand-slate/10" >
                                                        {
                                                            r ? ( <
                                                                img src = { r.image }
                                                                alt = { r.name }
                                                                className = "w-full h-full object-cover" /
                                                                >
                                                            ) : ( <
                                                                div className = "w-full h-full flex items-center justify-center text-brand-slate/30" >
                                                                <
                                                                i className = "fas fa-utensils" > < /i> <
                                                                /div>
                                                            )
                                                        } <
                                                        /div> <
                                                        div className = "flex-1 min-w-0" >
                                                        <
                                                        h5 className = "font-semibold text-brand-navy text-sm truncate" >
                                                        { r ? r.name : 'Restaurant' } < /h5> <
                                                        div className = "flex items-center gap-1 mt-0.5" > {
                                                            [1, 2, 3, 4, 5].map(i => ( <
                                                                i key = { i }
                                                                className = { `fa-solid fa-star text-[0.6rem] ${i <= rev.rating ? 'text-gold' : 'text-gray-300'}` } >
                                                                < /i>
                                                            ))
                                                        } <
                                                        /div> <
                                                        p className = "text-xs text-brand-slate/60 mt-1 line-clamp-2" >
                                                        { rev.comment } < /p> <
                                                        /div> <
                                                        /div>
                                                    );
                                                })
                                            )
                                        } <
                                        /div>
                                    )
                                } <
                                /div>

                                { /* Ad */ } <
                                div className = "px-4 pb-4 max-w-lg mx-auto" >
                                <
                                div className = "ad-card rounded-2xl p-4 shadow-premium" >
                                <
                                div className = "flex items-center gap-3 relative z-10" >
                                <
                                div className = "w-10 h-10 rounded-xl bg-gold/10 flex items-center justify-center shrink-0" >
                                <
                                i className = "fas fa-chart-line text-gold" > < /i> <
                                /div> <
                                div className = "flex-1" >
                                <
                                h5 className = "text-white font-semibold text-sm" > Own a Restaurant? < /h5> <
                                p className = "text-white/40 text-xs" > List your spot on BlueBite. < /p> <
                                /div> <
                                button className = "text-xs font-semibold text-gold hover:text-goldLight transition-colors" >
                                Get Started → <
                                /button> <
                                /div> <
                                /div> <
                                /div>

                                <
                                BottomNav / >
                                <
                                /div>
                            );
                        }

                        // ─── Bottom Navigation ───
                        function BottomNav() {
                            const { view, setView, user } = useContext(AppContext);
                            return ( <
                                    nav className = "fixed bottom-0 left-0 right-0 z-50 bottom-nav" >
                                    <
                                    div className = "max-w-lg mx-auto px-3" >
                                    <
                                    div className = "glass-dark rounded-2xl px-2 py-1.5 flex items-center justify-between shadow-premium-lg border border-white/10" >
                                    <
                                    button onClick = {
                                        () => setView('home') }
                                    className = { `flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-all ${view === 'home' ? 'text-gold' : 'text-white/40 hover:text-white/70'}` } >
                                    <
                                    i className = { `fas fa-home text-base ${view === 'home' ? 'text-gold' : ''}` } >
                                    < /i> <
                                    span className = "text-[0.45rem] font-medium uppercase tracking-wider" > Home < /span> <
                                    /button>

                                    <
                                    button onClick = {
                                        () => user ? setView('dashboard') : setShowAuth(true) }
                                    className = { `flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl transition-all ${view === 'dashboard' ? 'text-gold' : 'text-white/40 hover:text-white/70'}` } >
                                    <
                                    i className = { `fas fa-user text-base ${view === 'dashboard' ? 'text-gold' : ''}` } >
                                    < /i> <
                                    span className = "text-[0.45rem] font-medium uppercase tracking-wider" >
                                    { user ? 'Profile' : 'Sign In' } < /span> <
                                    /button>

                                    <
                                    button className = "flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl text-white/40 hover:text-white/70 transition-all" >
                                    <
                                    i className = "fas fa-search text-base" > < /i> <
                                    span className = "text-[0.45rem] font-medium uppercase tracking-wider" > Explore < /span> <
                                    /button>

                                    <
                                    button className = "flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl text-white/40 hover:text-white/70 transition-all" >
                                    <
                                    i className = "fas fa-bell text-base" > < /i> <
                                    span className = "text-[0.45rem] font-medium uppercase tracking-wider" > Alerts < /span> <
                                    /button> <
                                    /div> <
                                    /div> <
                                    /nav>
                                );
                            }

                            // ─── Auth Modal ───
                            function AuthModal() {
                                const {
                                    showAuth,
                                    setShowAuth,
                                    authMode,
                                    setAuthMode,
                                    authEmail,
                                    setAuthEmail,
                                    authPassword,
                                    setAuthPassword,
                                    authName,
                                    setAuthName,
                                    authLoading,
                                    handleAuthSubmit,
                                } = useContext(AppContext);

                                if (!showAuth) return null;

                                return ( <
                                        div className = "fixed inset-0 z-50 modal-overlay flex items-center justify-center p-4" >
                                        <
                                        div className = "w-full max-w-sm modal-slide" >
                                        <
                                        div className = "bg-white/95 backdrop-blur-2xl rounded-3xl p-6 shadow-premium-lg border border-white/40" >
                                        <
                                        div className = "flex items-center justify-between mb-4" >
                                        <
                                        h3 className = "font-display text-xl font-bold text-brand-navy" >
                                        { authMode === 'login' ? 'Welcome Back' : 'Join BlueBite' } <
                                        /h3> <
                                        button onClick = {
                                            () => setShowAuth(false) }
                                        className = "w-8 h-8 rounded-full bg-white/60 flex items-center justify-center text-brand-slate hover:bg-white transition-all" >
                                        <
                                        i className = "fas fa-times" > < /i> <
                                        /button> <
                                        /div>

                                        <
                                        p className = "text-sm text-brand-slate/60 mb-5" >
                                        { authMode === 'login' ?
                                            'Sign in to save favorites and review restaurants.' :
                                            'Create your account and start discovering.' } <
                                        /p>

                                        <
                                        form onSubmit = { handleAuthSubmit }
                                        className = "space-y-4" >
                                        {
                                            authMode === 'signup' && ( <
                                                div >
                                                <
                                                label className = "text-xs font-medium text-brand-slate/70 block mb-1" >
                                                Full Name <
                                                /label> <
                                                input type = "text"
                                                value = { authName }
                                                onChange = {
                                                    (e) => setAuthName(e.target.value) }
                                                className = "w-full bg-white/70 rounded-xl px-4 py-3 text-sm border border-white/50 outline-none focus:border-gold/50 transition-all" /
                                                >
                                                <
                                                /div>
                                            )
                                        } <
                                        div >
                                        <
                                        label className = "text-xs font-medium text-brand-slate/70 block mb-1" >
                                        Email <
                                        /label> <
                                        input type = "email"
                                        value = { authEmail }
                                        onChange = {
                                            (e) => setAuthEmail(e.target.value) }
                                        className = "w-full bg-white/70 rounded-xl px-4 py-3 text-sm border border-white/50 outline-none focus:border-gold/50 transition-all" /
                                        >
                                        <
                                        /div> <
                                        div >
                                        <
                                        label className = "text-xs font-medium text-brand-slate/70 block mb-1" >
                                        Password <
                                        /label> <
                                        input type = "password"
                                        value = { authPassword }
                                        onChange = {
                                            (e) => setAuthPassword(e.target.value) }
                                        className = "w-full bg-white/70 rounded-xl px-4 py-3 text-sm border border-white/50 outline-none focus:border-gold/50 transition-all" /
                                        >
                                        <
                                        /div>

                                        <
                                        button type = "submit"
                                        disabled = { authLoading }
                                        className = "btn-premium w-full py-3.5 rounded-xl text-sm font-semibold disabled:opacity-50" >
                                        { authLoading ? 'Processing...' : (authMode === 'login' ? 'Sign In' : 'Create
                                            Account') } <
                                        /button> <
                                        /form>

                                        <
                                        div className = "mt-4 text-center" >
                                        <
                                        button onClick = {
                                            () => setAuthMode(authMode === 'login' ? 'signup' : 'login') }
                                        className = "text-xs font-medium text-brand-slate/50 hover:text-gold transition-colors" >
                                        { authMode === 'login' ?
                                            'Don\'t have an account? Sign up →' :
                                            'Already have an account? Sign in →' } <
                                        /button> <
                                        /div> <
                                        /div> <
                                        /div> <
                                        /div>
                                    );
                                }

                                // ─── Toast Manager ───
                                function ToastManager() {
                                    const { toast } = useContext(AppContext);
                                    if (!toast) return null;
                                    return ( <
                                            div className = "fixed top-20 left-1/2 -translate-x-1/2 z-50 pointer-events-none" >
                                            <
                                            div className = "toast pointer-events-auto text-sm flex items-center gap-2.5" >
                                            <
                                            i className = "fas fa-check-circle text-gold" > < /i> { toast } <
                                            /div> <
                                            /div>
                                        );
                                    }

                                    // ─── Render ───
                                    const root = ReactDOM.createRoot(document.getElementById('root'));
                                    root.render( < App / > );
    </script>
</body>
</html>
