<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueBite</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>

<body>

  <div class="app">

    <!-- Navigation -->
    <header class="navbar">

      <button class="icon-btn">☰</button>

      <div class="logo">
        <div class="logo-circle">🍴</div>
        <span>Blue<span class="blue">Bite</span></span>
      </div>

      <div class="nav-right">

        <button class="icon-btn">🔍</button>

        <button class="icon-btn cart-btn">
          🛒
          <span class="badge">3</span>
        </button>

        <img src="https://i.pravatar.cc/80" alt="Profile" class="profile">

      </div>

    </header>

    <!-- Hero -->
    <section class="hero">

      <h1>
        Fresh Food
        <span class="blue">Delivered Fast</span>
      </h1>

      <p>
        Delicious meals from your favourite restaurants,
        delivered to your door.
      </p>

      <button class="order-btn">
        Order Now →
      </button>

    </section>

  </div>

</body>
</html>
