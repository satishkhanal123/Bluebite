                item.addEventListener('click', () => {
                    const pageId = item.dataset.page;
                    showPage(pageId);
                });
            });

            // Header avatar -> profile
            $('#headerAvatar').addEventListener('click', () => showPage('pageProfile'));

            // Refresh listings
            $('#refreshListings').addEventListener('click', () => fetchListings(state.currentCategory));

            // Detail modal close
            $('#detailClose').addEventListener('click', closeDetail);
            detailModal.addEventListener('click', (e) => {
                if (e.target === detailModal) closeDetail();
            });

            // ---- CREATE FORM ----
            const createForm = $('#createForm');
            createForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!state.user) {
                    toast('Please sign in to list an item.', 'error');
                    showPage('profile');
                    return;
                }

                const title = $('#listingTitle').value.trim();
                const price = $('#listingPrice').value;
                const category = $('#listingCategory').value;
                const condition = $('#listingCondition').value;
                const description = $('#listingDesc').value.trim();

                if (!title || !price || !category) {
                    toast('Please fill in all required fields.', 'error');
                    return;
                }

                const btn = $('#submitListingBtn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner spinner-sm"></span> Creating…';

                let imageUrls = [];
                if (state.uploadedImages.length > 0) {
                    imageUrls = await uploadImages(state.uploadedImages);
                }

                const result = await createListing({
                    title,
                    price,
                    category,
                    condition,
                    description: description || 'No description provided.',
                    images: imageUrls,
                });

                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check"></i> List Item';

                if (result) {
                    // Reset form
                    createForm.reset();
                    state.uploadedImages = [];
                    state.imageUrls = [];
                    $('#imagePreview').innerHTML = '';
                }
            });

            // Image upload
            const uploadZone = $('#imageUploadZone');
            const fileInput = $('#imageInput');
            uploadZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                const remaining = 4 - state.uploadedImages.length;
                const toAdd = files.slice(0, remaining);
                state.uploadedImages.push(...toAdd);
                renderImagePreviews();
                fileInput.value = '';
            });

            function renderImagePreviews() {
                const container = $('#imagePreview');
                container.innerHTML = state.uploadedImages.map((file, i) => `
              <div class="preview-item">
                <img src="${URL.createObjectURL(file)}" alt="preview" />
                <button class="remove-img" data-index="${i}"><i class="fas fa-times"></i></button>
              </div>
            `).join('');

                container.querySelectorAll('.remove-img').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const idx = parseInt(btn.dataset.index);
                        state.uploadedImages.splice(idx, 1);
                        renderImagePreviews();
                    });
                });
            }

            // ---- CHAT ----
            $('#chatSendBtn').addEventListener('click', sendChatMessage);
            $('#chatInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') sendChatMessage();
            });
            $('#chatBackBtn').addEventListener('click', closeChatDetail);

            // ---- KEYBOARD SHORTCUTS ----
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (detailModal.classList.contains('open')) closeDetail();
                    if (!$('#chatListContainer').classList.contains('hidden') && $('#chatDetailWrap').classList
                        .contains('hidden') === false) {
                        closeChatDetail();
                    }
                }
            });

            // ---- AUTO-REFRESH every 60s ----
            setInterval(() => {
                if (document.getElementById('pageHome').classList.contains('active')) {
                    fetchListings(state.currentCategory);
                }
            }, 60000);

            console.log('🚀 Marketly initialized');
            console.log(`👤 User: ${state.user?.email || 'not signed in'}`);
            console.log(`📦 Listings: ${state.listings.length}`);
            console.log(`💬 Chats: ${state.chatThreads.length}`);
        }

        // ============================================================
        //  START
        // ============================================================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
